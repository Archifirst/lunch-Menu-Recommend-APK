name: Build JumMeChu APK

on:
  push:
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: 1. 저장소 파일(로고 이미지 등) 불러오기
        uses: actions/checkout@v4

      - name: 2. Java 17 설치
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 3. Node.js 20 설치
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 4. Gradle 8.7 및 내장 Android SDK 연결
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.7-bin.zip -P /tmp
          sudo unzip -q -d /opt/gradle /tmp/gradle-8.7-bin.zip
          echo "/opt/gradle/gradle-8.7/bin" >> $GITHUB_PATH

          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          yes | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null || true
          $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: 5. Cordova 프로젝트 생성 및 로고·권한 적용 후 빌드
        run: |
          npm install -g cordova
          cordova create lunch_app com.lunch.jummechu JumMeChu
          cd lunch_app
          
          # Android 13.0.0(API 34) 플랫폼 추가
          cordova platform add android@13.0.0

          # 앱 이름을 한글 '점메추'로 변경
          sed -i 's/<name>JumMeChu<\/name>/<name>점메추<\/name>/g' config.xml

          # 저장소에 logo.png 또는 icon.png가 있으면 앱 아이콘으로 자동 적용
          if [ -f "../logo.png" ]; then
            cp ../logo.png ./icon.png
            sed -i 's/<\/widget>/    <icon src="icon.png" \/>\n<\/widget>/g' config.xml
          elif [ -f "../icon.png" ]; then
            cp ../icon.png ./icon.png
            sed -i 's/<\/widget>/    <icon src="icon.png" \/>\n<\/widget>/g' config.xml
          fi

          # 스트림릿 웹 주소로 연결되는 화면 생성
          cat << 'EOF' > www/index.html
          <!DOCTYPE html>
          <html>
          <head>
              <meta charset="utf-8">
              <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
              <script>
                  window.location.replace("https://lunch-menu-recommend-jnjrrtvhafjvsaxxaoi62j.streamlit.app/");
              </script>
          </head>
          <body style="background-color: #FAF8F5; margin: 0;"></body>
          </html>
          EOF

          # AndroidManifest.xml에 GPS 위치 권한 주입
          MANIFEST="platforms/android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST" ]; then
            sed -i 's/<application/<uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" \/><uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" \/><application/g' "$MANIFEST"
          fi

          # APK 빌드 실행
          cordova build android --debug

      - name: 6. 완성된 점메추 APK 업로드
        uses: actions/upload-artifact@v4
        with:
          name: JumMeChu-APK
          path: lunch_app/platforms/android/app/build/outputs/apk/debug/app-debug.apk
