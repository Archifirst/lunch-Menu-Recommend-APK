name: Build JumMeChu APK

# 파일을 수정하거나 저장(push)하면 무조건 자동으로 실행되도록 설정!
on:
  push:
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Java 17 및 Node.js 설치
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 2. Android SDK 및 Gradle 설정
        uses: android-actions/setup-android@v3

      - name: 3. Cordova 설치 및 프로젝트 생성
        run: |
          npm install -g cordova
          # 에러 방지를 위해 영문으로 먼저 생성 후 아래에서 한글 이름(점메추)으로 변경
          cordova create lunch_app com.lunch.jummechu JumMeChu
          cd lunch_app
          cordova platform add android@13.0.0

          # 스마트폰에 표시될 앱 이름을 '점메추'로 변경
          sed -i 's/<name>JumMeChu<\/name>/<name>점메추<\/name>/g' config.xml

          # 스트림릿 웹 주소로 바로 연결되는 화면 생성
          cat << 'EOF' > www/index.html
          <!DOCTYPE html>
          <html>
          <head>
              <meta charset="utf-8">
              <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
              <script>
                  window.location.replace("https://여기에-스트림릿-주소.streamlit.app");
              </script>
          </head>
          <body style="background-color: #FAF8F5; margin: 0;"></body>
          </html>
          EOF

      - name: 4. 위치(GPS) 권한 추가 및 APK 빌드
        run: |
          cd lunch_app
          # AndroidManifest.xml에 GPS 권한 직접 추가
          MANIFEST="platforms/android/app/src/main/AndroidManifest.xml"
          sed -i 's/<application/<uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" \/><uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" \/><application/g' $MANIFEST
          
          # APK 빌드 실행
          cordova build android --debug

      - name: 5. 완성된 점메추 APK 업로드
        uses: actions/upload-artifact@v4
        with:
          name: JumMeChu-APK
          path: lunch_app/platforms/android/app/build/outputs/apk/debug/app-debug.apk
